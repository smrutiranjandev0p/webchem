name: WebChem Release Candidate Checks

on:
  push:
    branches:
      - webchem-upgrade
      - main
  pull_request:
    branches:
      - main
      - webchem-upgrade
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script\b[^>]*>(.*?)</script>", html, flags=re.S|re.I)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          for i, script in enumerate(scripts):
              Path(f"/tmp/webchem-inline-{i}.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(scripts)} inline scripts")
          PY
          for script in /tmp/webchem-inline-*.js; do node --check "$script"; done
      - name: Validate backend JavaScript syntax
        run: |
          find backend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run release integration checks
        run: python -m unittest discover -s tests -v
